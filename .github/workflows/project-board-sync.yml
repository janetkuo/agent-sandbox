name: Project Board Sync

on:
  issues:
    types: [labeled, unlabeled]
  pull_request:
    types: [labeled, unlabeled]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout agent-sandbox
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Sync Label to Project Field
        env:
          GH_TOKEN: ${{ secrets.PROJECT_BOT_TOKEN }}
        run: |
          ./dev/tools/sync-project-board "${{ github.event_name }}" "${{ github.event.label.name }}" "${{ github.event.action }}" "${{ github.event.issue.node_id || github.event.pull_request.node_id }}"
